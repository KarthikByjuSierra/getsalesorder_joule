apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: sales-order-retrieval-agent
  description: AI agent that retrieves complete sales order details from SAP S/4HANA On-Premise by order number or search attributes, returning header, line items, delivery, and billing information.
  version: "1.0.0"

provides:
  apis:
    - name: sales-order-retrieval-agent
      kind: a2a
      ordId: customer.build:apiResource:sales-order-retrieval-3d781.sales-order-retrieval-agent:v1

requires:
  - name: default
    kind: platform-service
    service: destination
    plan: lite
    parameters:
      existing-service-instance-name: destination-service
  - name: btp-connectivity
    kind: platform-service
    service: connectivity
    plan: lite
    parameters:
      existing-service-instance-name: btp-connectivity

container:
  buildPath: .
  port: 5000
  env:
    - name: PROXY_CONFIG_CHECK
      value: "container_env_working"

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
